<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="45%" stop-color="#2e1e14"/>
      <stop offset="100%" stop-color="#7a4718"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c98a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c9711a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9711a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neckWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3821"/>
      <stop offset="100%" stop-color="#2b1a0e"/>
    </linearGradient>
    <linearGradient id="bodyWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2a15c"/>
      <stop offset="55%" stop-color="#b3702c"/>
      <stop offset="100%" stop-color="#6b3a11"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#heroBg)"/>

  <!-- soft stage spotlight glow, upper-right -->
  <circle cx="1180" cy="230" r="380" fill="url(#spot)"/>

  <!-- bokeh particles -->
  <g fill="#f2d9b8">
    <circle cx="1360" cy="120" r="10" opacity="0.35"/>
    <circle cx="1460" cy="260" r="16" opacity="0.22"/>
    <circle cx="1300" cy="380" r="7" opacity="0.30"/>
    <circle cx="1500" cy="450" r="12" opacity="0.18"/>
    <circle cx="1080" cy="80" r="6" opacity="0.30"/>
    <circle cx="980" cy="470" r="9" opacity="0.18"/>
  </g>

  <!-- guitar, angled, occupying right/upper two-thirds; bottom-left stays clear for text -->
  <g transform="translate(870,-60) rotate(28)">
    <!-- headstock -->
    <path d="M 330 20 Q 316 2 336 -2 L 382 -2 Q 402 2 388 20 L 380 66 L 338 66 Z" fill="url(#neckWood)"/>
    <circle cx="344" cy="16" r="5" fill="#f2d9b8"/>
    <circle cx="374" cy="16" r="5" fill="#f2d9b8"/>
    <circle cx="344" cy="42" r="5" fill="#f2d9b8"/>
    <circle cx="374" cy="42" r="5" fill="#f2d9b8"/>
    <!-- neck -->
    <rect x="332" y="62" width="54" height="330" fill="url(#neckWood)"/>
    <g fill="#f2d9b8" opacity="0.75">
      <rect x="342" y="90" width="2.4" height="300"/>
      <rect x="358" y="90" width="2.4" height="300"/>
      <rect x="374" y="90" width="2.4" height="300"/>
    </g>
    <g stroke="#f2d9b8" stroke-width="2.5" opacity="0.6">
      <line x1="332" y1="120" x2="386" y2="120"/>
      <line x1="332" y1="160" x2="386" y2="160"/>
      <line x1="332" y1="200" x2="386" y2="200"/>
      <line x1="332" y1="240" x2="386" y2="240"/>
      <line x1="332" y1="280" x2="386" y2="280"/>
      <line x1="332" y1="320" x2="386" y2="320"/>
    </g>
    <!-- body -->
    <path d="M 359 386
             C 270 386 190 435 182 512
             C 176 562 206 592 232 630
             C 260 672 306 710 359 710
             C 412 710 458 672 486 630
             C 512 592 542 562 536 512
             C 528 435 448 386 359 386 Z"
          fill="url(#bodyWood)" stroke="#3a2110" stroke-width="4"/>
    <ellipse cx="359" cy="520" rx="72" ry="72" fill="#3a2110"/>
    <ellipse cx="359" cy="520" rx="62" ry="62" fill="#160d07"/>
    <ellipse cx="359" cy="520" rx="78" ry="78" fill="none" stroke="#2b1a0e" stroke-width="4"/>
    <path d="M 359 386 C 300 386 248 408 222 444 C 288 424 432 424 496 444 C 470 408 418 386 359 386 Z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- subtle sound-wave lines, lower right, echoing motion -->
  <g stroke="#f2d9b8" stroke-width="3" fill="none" opacity="0.18">
    <path d="M 1250 520 Q 1290 470 1250 420 Q 1210 370 1250 320"/>
    <path d="M 1310 520 Q 1360 470 1310 420 Q 1260 370 1310 320"/>
    <path d="M 1370 520 Q 1430 470 1370 420 Q 1310 370 1370 320"/>
  </g>
</svg>
