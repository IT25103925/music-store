## =========================================================
## Web-based Music Store - default configuration
## Uses H2 (file-based) so the project runs immediately with
## zero database setup. For your real submission, switch to
## MySQL using application-mysql.properties (see README.md).
## =========================================================

spring.application.name=music-store

# ---- MySQL database (XAMPP / HeidiSQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/musicstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- File upload (product / instrument images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ---- Mail (Notification Management module) ----
# Fill these in with a real SMTP account (e.g. Gmail app password) to send
# real emails. If left blank, NotificationService just logs + stores
# in-app notifications instead of throwing errors.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail-address-goes-here
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.email-enabled=false

# ---- App-specific ----
app.name=Melodia Music Store
server.port=8080

# ---- TEMP: show real error details on the error page while debugging ----
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
