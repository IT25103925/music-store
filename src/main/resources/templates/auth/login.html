<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Melodia Music Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #FAF8F5 !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        .auth-page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .auth-card-modern {
            background: #FFFFFF !important;
            border-radius: 18px !important;
            border: 1.5px solid #EAE5D9 !important;
            box-shadow: 0 12px 36px rgba(45, 36, 30, 0.1) !important;
            padding: 36px 32px !important;
            box-sizing: border-box !important;
        }

        .auth-card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid #D4AF37;
            background: radial-gradient(circle at 35% 30%, #F3E5AB, #C29A38 60%, #9A7B38 100%);
            box-shadow: inset 0 0 0 4px #2D241E, 0 4px 12px rgba(200, 162, 75, 0.2);
            margin-bottom: 14px;
        }

        .auth-card-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #2D241E;
            margin: 0 0 6px 0;
        }

        .auth-card-subtitle {
            font-size: 0.88rem;
            color: #7C6D5D;
            margin: 0;
        }

        .auth-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .auth-form-label {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: #5C4A3E;
        }

        .auth-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-icon {
            position: absolute;
            left: 14px;
            color: #9C8C7E;
            pointer-events: none;
            z-index: 2;
        }

        .auth-input-field {
            width: 100% !important;
            height: 44px !important;
            background-color: #FAF8F5 !important;
            border: 1.5px solid #E5DEC9 !important;
            border-radius: 10px !important;
            padding: 0 14px 0 42px !important;
            color: #2D241E !important;
            font-size: 0.95rem !important;
            font-weight: 600 !important;
            outline: none !important;
            transition: all 0.2s ease !important;
            box-sizing: border-box !important;
        }

        .auth-input-field:focus {
            background-color: #FFFFFF !important;
            border-color: #C8A24B !important;
            box-shadow: 0 0 0 4px rgba(200, 162, 75, 0.16) !important;
        }

        .auth-toggle-pwd {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #9C8C7E;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .auth-primary-btn {
            background: linear-gradient(135deg, #3a2717 0%, #211510 100%) !important;
            color: #FAF8F5 !important;
            font-weight: 700 !important;
            font-size: 0.9rem !important;
            letter-spacing: 0.08em !important;
            text-transform: uppercase !important;
            border-radius: 10px !important;
            padding: 14px 20px !important;
            width: 100% !important;
            border: 1px solid #9A7B38 !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            box-shadow: 0 4px 14px rgba(33, 21, 16, 0.2) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            margin-top: 8px !important;
        }

        .auth-primary-btn:hover {
            background: linear-gradient(135deg, #4d3521 0%, #2e1d17 100%) !important;
            border-color: #DFB967 !important;
            color: #DFB967 !important;
        }

        .auth-card-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #F5EFE6;
            font-size: 0.88rem;
            color: #7C6D5D;
        }

        .auth-card-footer a {
            color: #9A7B38;
            font-weight: 700;
            text-decoration: none;
        }
        
        .auth-card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page-wrapper">
    <div class="auth-container">
        <div class="auth-card-modern">
            <div class="auth-card-header">
                <div class="auth-logo-badge">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D241E" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
                <h1 class="auth-card-title">Sign In</h1>
                <p class="auth-card-subtitle">Access your Melodia Music account</p>
            </div>

            <!-- Status Alerts -->
            <div class="alert alert-success" th:if="${param.registered != null}" style="border-radius: 10px; margin-bottom: 18px; background: #ECFDF5; color: #065F46; padding: 12px 14px; border: 1px solid #A7F3D0; font-size: 0.88rem; font-weight: 600;">
                Account created successfully! You can now log in below.
            </div>
            <div class="alert alert-error" th:if="${param.error != null}" style="border-radius: 10px; margin-bottom: 18px; background: #FEF2F2; color: #991B1B; padding: 12px 14px; border: 1px solid #FCA5A5; font-size: 0.88rem; font-weight: 600;">
                ⚠️ Invalid email address or password. Please try again.
            </div>
            <div class="alert alert-info" th:if="${param.logout != null}" style="border-radius: 10px; margin-bottom: 18px; background: #EFF6FF; color: #1E40AF; padding: 12px 14px; border: 1px solid #BFDBFE; font-size: 0.88rem; font-weight: 600;">
                You have been logged out safely.
            </div>

            <!-- 1-Click Quick Demo Presets -->
            <div style="margin-bottom: 20px; padding: 12px 14px; background: #FAF8F5; border: 1.5px dashed #EAE4D9; border-radius: 12px; text-align: center;">
                <span style="font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #9A7B38; display: block; margin-bottom: 8px;">1-Click Quick Demo Login</span>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button type="button" onclick="fillDemoUser('customer@musicstore.lk', 'Customer@123')" style="background: #2D241E; color: #FAF8F5; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; cursor: pointer;">
                        👤 Customer Demo
                    </button>
                    <button type="button" onclick="fillDemoUser('admin@musicstore.lk', 'Admin@123')" style="background: linear-gradient(135deg, #DFB967 0%, #C29A38 100%); color: #1F1610; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 800; font-size: 0.78rem; cursor: pointer;">
                        ⚡ Admin Demo
                    </button>
                </div>
            </div>

            <form th:action="@{/login}" method="post">
                <!-- Email Field -->
                <div class="auth-form-group">
                    <label class="auth-form-label" for="loginEmail">Email Address</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="loginEmail" name="username" class="auth-input-field" required placeholder="name@example.com"/>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="auth-form-group">
                    <label class="auth-form-label" for="loginPassword">Password</label>
                    <div class="auth-input-wrapper">
                        <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="loginPassword" name="password" class="auth-input-field" required placeholder="••••••••"/>
                        <button type="button" class="auth-toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Toggle password view">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-primary-btn">
                    <span>Sign In</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="auth-card-footer">
                Don't have an account? <a th:href="@{/register}">Create an account</a>
            </div>
        </div>
    </div>
</div>

<script>
    function fillDemoUser(email, pwd) {
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = pwd;
    }

    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        } else {
            pwdInput.type = 'password';
            eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }
    }
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
