<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Melodia Music Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: var(--cream, #FAF8F5) !important;
            font-family: var(--font-body, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
        }

        .checkout-wrapper {
            max-width: 640px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .checkout-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid #EAE4D9;
            box-shadow: 0 12px 36px rgba(45, 36, 30, 0.08);
            padding: 44px;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .checkout-eyebrow {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 700;
            color: var(--gold-deep, #9A7B38);
            margin-bottom: 6px;
            display: block;
        }

        .checkout-title {
            font-family: var(--font-display, 'Playfair Display', Georgia, serif);
            font-size: 2.2rem;
            font-weight: 700;
            color: #2D241E;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #4A3A2F;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        .input-with-icon svg {
            position: absolute;
            left: 14px;
            top: 15px;
            color: var(--gold-deep, #9A7B38);
            pointer-events: none;
        }

        .input-with-icon input,
        .input-with-icon textarea {
            padding-left: 44px !important;
            width: 100%;
            border-radius: 10px;
            border: 1.5px solid #E6DFD5;
            background: #FFFFFF;
            font-size: 0.95rem;
            color: #2D241E;
            font-family: inherit;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .input-with-icon input {
            height: 48px;
        }

        .input-with-icon textarea {
            padding-top: 12px;
            line-height: 1.5;
        }

        .input-with-icon input:focus,
        .input-with-icon textarea:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
            outline: none;
        }

        /* Payment Method Options */
        .pay-option {
            background: #FAF8F5;
            border: 2px solid #EAE4D9;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .pay-option:hover {
            border-color: #D4AF37;
            background: #FFFFFF;
        }

        .pay-option.active {
            background: #FFFDF7;
            border-color: #D4AF37;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.12);
        }

        .info-panel-box {
            background: #FAF8F5;
            border: 1.5px solid #EAE4D9;
            border-radius: 12px;
            padding: 18px 20px;
            margin-top: 16px;
            display: none;
        }

        .submit-checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #DFB967 0%, #C29A38 100%);
            color: #1F1610;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.22s ease;
            box-shadow: 0 6px 16px rgba(194, 154, 56, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
        }

        .submit-checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(194, 154, 56, 0.4);
        }

        @media (max-width: 600px) {
            .checkout-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="checkout-wrapper">
    <div class="checkout-card">
        <div class="checkout-header">
            <span class="checkout-eyebrow">Final Step Before Payment</span>
            <h1 class="checkout-title">Shipping &amp; Contact</h1>
        </div>

        <!-- Order & Offer Summary Box -->
        <div th:if="${activeItems != null and not #lists.isEmpty(activeItems)}" style="margin-bottom: 28px; padding: 20px; background: #FAF8F5; border: 1.5px solid #EAE4D9; border-radius: 16px;">
            <strong style="font-size: 0.95rem; color: #2D241E; display: block; margin-bottom: 12px; font-family: var(--font-display, serif);">
                🛒 Order Summary (<span th:text="${#lists.size(activeItems)}">1</span> item(s))
            </strong>
            <div th:each="item : ${activeItems}" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.88rem;">
                <span th:text="${item.product.name} + ' (x' + ${item.quantity} + ')'" style="color: #4A3A2F; font-weight: 600;">Yamaha Guitar</span>
                <span th:text="'LKR ' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}" style="color: #2D241E; font-weight: 700;">LKR 45,000</span>
            </div>
            
            <div style="border-top: 1px dashed #EAE4D9; margin-top: 10px; padding-top: 10px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.88rem; color: #6E6258; margin-bottom: 4px;">
                    <span>Subtotal:</span>
                    <strong th:text="'LKR ' + ${subtotal != null ? #numbers.formatDecimal(subtotal, 1, 'COMMA', 0, 'POINT') : '0'}">LKR 45,000</strong>
                </div>
                
                <div th:if="${discount != null and discount.compareTo(T(java.math.BigDecimal).ZERO) > 0}" style="display: flex; justify-content: space-between; font-size: 0.88rem; color: #10B981; margin-bottom: 4px; font-weight: 700;">
                    <span>Discount (<span th:text="${cart.appliedOfferCode}">WELCOME10</span>):</span>
                    <span th:text="'- LKR ' + ${#numbers.formatDecimal(discount, 1, 'COMMA', 0, 'POINT')}">- LKR 4,500</span>
                </div>
                
                <div style="display: flex; justify-content: space-between; font-size: 1.1rem; color: #2D241E; font-weight: 800; margin-top: 8px; padding-top: 8px; border-top: 2px solid #EAE4D9;">
                    <span>Total Amount:</span>
                    <span style="color: #9A7B38;" th:text="'LKR ' + ${total != null ? #numbers.formatDecimal(total, 1, 'COMMA', 0, 'POINT') : '0'}">LKR 40,500</span>
                </div>
            </div>
        </div>

        <div class="alert alert-error" th:if="${checkoutError}" th:text="${checkoutError}"></div>

        <form th:action="@{/orders/checkout}" method="post" id="checkoutForm">
            
            <!-- Shipping Details -->
            <div class="form-group">
                <label>Recipient Full Name</label>
                <div class="input-with-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" name="recipientName" placeholder="Full name of recipient" th:value="${user != null ? user.fullName : ''}"/>
                </div>
            </div>

            <div class="form-group">
                <label>Shipping Street Address</label>
                <div class="input-with-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <textarea name="shippingAddress" rows="2" placeholder="House / Flat No., Street Name" th:text="${user != null ? user.address : ''}"></textarea>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>City / Town <span style="font-weight: 400; text-transform: none; color: #888;">(Optional)</span></label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                        <input type="text" name="city" placeholder="e.g. Colombo, Kandy"/>
                    </div>
                </div>

                <div class="form-group">
                    <label>Postal / Zip Code <span style="font-weight: 400; text-transform: none; color: #888;">(Optional)</span></label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                        <input type="text" name="postalCode" placeholder="e.g. 00300"/>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Contact Phone Number</label>
                <div class="input-with-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    <input type="text" name="contactPhone" placeholder="07X XXX XXXX" th:value="${user != null ? user.phone : ''}"/>
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Notes / Special Instructions <span style="font-weight: 400; text-transform: none; color: #888;">(Optional)</span></label>
                <div class="input-with-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <textarea name="orderNotes" rows="2" placeholder="e.g. Leave package at front gate, Call before delivery"></textarea>
                </div>
            </div>

            <button type="submit" class="submit-checkout-btn" id="submitBtn">
                <span>PROCEED TO PAYMENT &rarr;</span>
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
