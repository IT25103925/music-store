## Activate with: --spring.profiles.active=mysql
## or set SPRING_PROFILES_ACTIVE=mysql
##
## 1. Create the database first:  CREATE DATABASE musicstore_db;
## 2. Update username/password below to match your MySQL install.

spring.datasource.url=jdbc:mysql://localhost:3306/musicstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
